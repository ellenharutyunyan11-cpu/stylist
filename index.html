<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stylist</title>
<script>/* Apply the theme before the page draws, so it never flashes the other one. Dark unless the person picked Light or Automatic. */
(()=>{ let t = 'dark'; try{ t = localStorage.getItem('stylist.theme') || 'dark'; }catch(e){} if (t !== 'auto') document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; })();</script>
<style>
/* Layout: one calm column, sticky glass header with a sliding segmented control; content is grids of soft tiles. */
:root{
  --bg:#ffffff; --surface:#ffffff; --tile:#ecebe8; --fg:#0b0b0c; --muted:#6e6e73;
  --line:rgba(0,0,0,.08); --ink:#0b0b0c; --on-ink:#ffffff; --glass:rgba(255,255,255,.78);
  --heart:#ff375f; --ok:#30a46c; --warn:#c2410c;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:20px; --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#111113; --tile:#1c1c1e; --fg:#f5f5f7; --muted:#8e8e93;
  --line:rgba(255,255,255,.1); --ink:#f5f5f7; --on-ink:#000000; --glass:rgba(0,0,0,.72);
  --shadow:0 0 0 1px rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111113; --tile:#1c1c1e; --fg:#f5f5f7; --muted:#8e8e93;
  --line:rgba(255,255,255,.1); --ink:#f5f5f7; --on-ink:#000000; --glass:rgba(0,0,0,.72);
  --shadow:0 0 0 1px rgba(255,255,255,.06); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}

.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:600 20px/1 var(--display);letter-spacing:-.03em}
.mark{width:28px;height:28px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.mark svg{width:16px;height:16px}
.ai{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:99px;background:var(--tile)}
.ai i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ai.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.ai.wait i{animation:blink 1s infinite}

.seg{position:relative;display:flex;background:var(--tile);border-radius:12px;padding:3px;gap:2px}
.seg button{position:relative;z-index:1;padding:7px 16px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);transition:color .25s;white-space:nowrap}
.seg button[aria-selected="true"]{color:var(--fg)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .45s var(--spring),width .45s var(--spring)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--ink);color:var(--on-ink);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.badge.bump{animation:bump .5s var(--spring)}
.badge[hidden]{display:none!important}

main{padding-block:28px 96px}
.view{animation:viewIn .5s var(--ease)}
h1{font:700 clamp(28px,5vw,40px)/1.05 var(--display);letter-spacing:-.035em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:15px;transition:transform .2s var(--spring),opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.btn.ghost{background:var(--tile);color:var(--fg)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn svg{width:18px;height:18px}
.link{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* Chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:99px;background:var(--tile);font-size:14px;font-weight:500;transition:background .25s,color .25s,transform .2s var(--spring)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:var(--tile);font-size:12.5px;color:var(--fg)}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.4)}

/* Wardrobe grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.tile{position:relative;aspect-ratio:1;max-width:100%;border-radius:var(--r);background:var(--tile);overflow:hidden;display:grid;place-items:center;transition:transform .35s var(--spring),box-shadow .35s}
.tile svg.g{width:72%;height:72%;transition:transform .5s var(--spring)}
.tile img{width:100%;height:100%;object-fit:cover}
.tile img.cut,.preview img.cut{object-fit:contain;padding:12%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));transition:transform .5s var(--spring)}
/* Your own pieces saved see-through (before white backgrounds) are shown on white, like new ones. */
.tile img.white,.preview img.white{object-fit:contain;padding:8%;background:#fff}
.collage .tile img.cut{padding:10%}
button.card:hover .tile img.cut{transform:scale(1.06) rotate(-2deg)}
button.card:hover .tile{transform:translateY(-3px);box-shadow:var(--shadow)}
button.card:hover .tile svg.g{transform:scale(1.06) rotate(-2deg)}
button.card:active .tile{transform:scale(.97)}
.cname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:-4px}
.add .tile{background:transparent;border:1.5px dashed color-mix(in srgb,var(--muted) 55%,transparent)}
.add .plus{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;transition:transform .4s var(--spring)}
.add:hover .plus{transform:rotate(90deg) scale(1.08)}
.card.new{animation:dropIn .7s var(--spring)}
.note{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;color:var(--muted)}

/* Starter wardrobe guide: a checklist card that walks a new user through their first five pieces. */
.guide{margin-top:18px;background:var(--surface);border-radius:24px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px;animation:rise .5s var(--spring) both}
.g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.g-head .eyebrow{margin-bottom:4px}
.g-head h2{margin:0;font:700 22px/1.15 var(--display);letter-spacing:-.03em;text-wrap:balance}
.g-bar{height:6px;border-radius:3px;background:var(--tile);overflow:hidden}
.g-bar i{display:block;height:100%;border-radius:3px;background:var(--ink);transition:width .7s var(--ease)}
.g-steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.g-steps li{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px}
.g-steps li.cur{background:var(--tile)}
.g-ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.g-ic svg{width:100%;height:100%}
.g-steps li.cur .g-ic{background:var(--surface)}
.g-steps li.ok .g-ic{background:var(--ink);color:var(--on-ink)}
.g-steps li.ok .g-ic svg{width:20px;height:20px}
.g-txt{flex:1;min-width:0;display:grid;gap:2px;font-size:14.5px}
.g-txt span{color:var(--muted);font-size:13px}
.g-steps li.ok b{color:var(--muted);font-weight:500;text-decoration:line-through}
.g-ready{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:var(--tile);font-size:14px}
.g-ready svg{width:18px;height:18px;flex:none}
.g-ready span{flex:1;min-width:160px}
.g-row{display:flex;gap:8px;flex-wrap:wrap}
.tips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.starter{display:grid;gap:8px}
/* Worth adding: pieces that would make the most new outfits, with links to search favorite shops. */
.ideas{margin-top:40px;display:grid;gap:14px}
.ideas h2{margin:0;font:700 22px/1.2 var(--display);letter-spacing:-.03em}
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.idea{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px;align-content:start}
.idea-top{display:flex;gap:12px;align-items:center}
.idea-top .tile{flex:none;width:76px;border-radius:14px}
.idea-top .tile svg{width:80%;height:80%}
.idea-txt{display:grid;gap:3px;min-width:0;font-size:15px}
.idea-shops{display:flex;flex-wrap:wrap;gap:6px}
.idea-shops .chip{display:inline-flex;align-items:center;text-decoration:none;color:var(--fg)}
.idea .link{justify-self:start}
.starter > div{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);animation:rise .5s var(--spring) both}
.starter b{display:block;font-size:15px}
.starter .d{color:var(--muted);font-size:13px}

/* Style me */
.panel{background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:grid;gap:18px}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.field{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 10%,transparent)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.drop{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;border:1.5px dashed color-mix(in srgb,var(--muted) 55%,transparent);cursor:pointer;transition:background .25s,border-color .25s}
.drop:hover,.drop.over{background:var(--tile);border-color:var(--ink)}
.drop .ic{width:52px;height:52px;flex:none;border-radius:14px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.drop .ic img{width:100%;height:100%;object-fit:cover}
.drop b{display:block;font-weight:600}
.drop span{color:var(--muted);font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:22px}
.look{background:var(--surface);border-radius:24px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:rise .6s var(--spring) both;min-width:0}
.collage{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:6px}
.collage .tile{border-radius:14px}
.collage .tile.find::after{content:"New find";position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:99px;background:var(--ink);color:var(--on-ink)}
.lhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.lhead h3{margin:0;font:600 17px/1.25 var(--display);letter-spacing:-.02em}
.why{margin:0;color:var(--muted);font-size:14px}
.pieces{display:flex;gap:6px;flex-wrap:wrap}

.heart{position:relative;width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tile);transition:transform .2s var(--spring)}
.heart:active{transform:scale(.88)}
.heart svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:1.8;transition:fill .2s,stroke .2s}
.heart[aria-pressed="true"] svg{fill:var(--heart);stroke:var(--heart);animation:pop .45s var(--spring)}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--heart);animation:fly .6s var(--ease) forwards}

.skel{background:var(--surface);border-radius:24px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px}
.shim{border-radius:14px;background:linear-gradient(100deg,var(--tile) 30%,color-mix(in srgb,var(--tile) 60%,var(--surface)) 50%,var(--tile) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);margin-top:22px;font-size:14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--fg));animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.caption{transition:opacity .3s}

.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:60px 16px;color:var(--muted)}
.empty .big{width:72px;height:72px;border-radius:22px;background:var(--tile);display:grid;place-items:center;animation:float 3s ease-in-out infinite}
.empty .big svg{width:34px;height:34px;stroke:var(--fg);fill:none;stroke-width:1.6}
.empty b{color:var(--fg);font-size:17px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.scrim.open{opacity:1}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));transform:translate(-50%,105%);transition:transform .5s var(--spring)}
.sheet.open{transform:translate(-50%,0)}
@media (min-width:700px){.sheet{bottom:auto;top:50%;border-radius:28px;transform:translate(-50%,-44%) scale(.96);opacity:0;transition:transform .45s var(--spring),opacity .25s}.sheet.open{transform:translate(-50%,-50%);opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font:700 22px/1.2 var(--display);letter-spacing:-.03em}
.x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--tile);display:grid;place-items:center;transition:transform .25s var(--spring)}
.x:hover{transform:rotate(90deg)}
.x svg{width:14px;height:14px;stroke:var(--fg);stroke-width:2.2}
.preview{position:relative;aspect-ratio:1;width:min(300px,100%);max-width:100%;margin:14px auto;border-radius:22px;background:var(--tile);overflow:hidden;display:grid;place-items:center}
.preview img{width:100%;height:100%;object-fit:cover}
.preview svg.g{width:70%;height:70%}
.scan{position:absolute;left:0;right:0;height:40%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.55),transparent);animation:scan 1.6s ease-in-out infinite;mix-blend-mode:overlay}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:8px;align-items:center}
.pick input[type=color]{width:44px;height:44px;border:0;border-radius:12px;padding:0;background:none;flex:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags .tag{animation:rise .5s var(--spring) both}
.danger{color:var(--warn)}

/* Profile button */
.right{display:flex;align-items:center;gap:10px;min-width:0}
.me{width:36px;height:36px;flex:none;border-radius:50%;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:15px;display:grid;place-items:center;transition:transform .25s var(--spring)}
.me:hover{transform:scale(1.06)}.me:active{transform:scale(.92)}
.me svg{width:18px;height:18px}
.me.xl{width:56px;height:56px;font-size:22px;cursor:default;transform:none}
.prof{display:flex;align-items:center;gap:14px;margin:6px 0 20px;padding-right:40px}
.sec{display:grid;gap:4px;margin-bottom:16px}
.perso{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.perso svg{width:16px;height:16px}
.eyebrow{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}

/* Sign up + onboarding */
body.locked{overflow:hidden}
.auth{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;animation:authIn .45s var(--ease)}
.auth.leave{animation:authOut .45s var(--ease) forwards}
.auth-in{max-width:560px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 20px)}
.ob-body{flex:1;display:flex;flex-direction:column;gap:14px}
.step-in{animation:stepIn .55s var(--spring)}
.step-back{animation:stepBack .55s var(--spring)}
.big{font:700 clamp(32px,7vw,44px)/1.04 var(--display);letter-spacing:-.04em;margin:0;text-wrap:balance}
.ob-body .sub{margin:0}
.sub.flash{color:var(--fg)}
.field.lg{height:52px;font-size:16px;border-radius:14px}
.btn.wide{width:100%;height:54px;font-size:16px}
.fine{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.link.center{align-self:center}
.err{margin:0;color:var(--warn);font-size:13.5px}
.shake{animation:shake .4s}
.su-mark{width:56px;height:56px;border-radius:17px;background:var(--ink);display:grid;place-items:center;margin-top:clamp(8px,6vh,56px);animation:grow .6s var(--spring) both}
.su-mark svg{width:30px;height:30px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:99px;background:var(--surface);color:var(--fg);font-weight:600;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--line),var(--shadow);transition:transform .2s var(--spring),box-shadow .2s}
.gbtn:hover{box-shadow:inset 0 0 0 1.5px var(--fg),var(--shadow)}
.gbtn:active{transform:scale(.97)}
.gbtn:disabled{cursor:default}
.gbtn svg{width:20px;height:20px}
.glogo{width:20px;height:20px;flex:none}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.me img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.mailic{width:56px;height:56px;border-radius:17px;background:var(--tile);display:grid;place-items:center;margin-top:clamp(8px,4vh,32px);animation:grow .6s var(--spring) both}
.mailic.again{animation:pop .5s var(--spring)}
.mailic svg{width:28px;height:28px;stroke:var(--fg);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:400px;margin-top:8px}
.otp input{width:100%;min-width:0;height:60px;padding:0;text-align:center;font:600 24px/1 var(--display);border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);outline:none;caret-color:var(--ink);font-variant-numeric:tabular-nums;transition:border-color .2s,box-shadow .2s,background .3s,color .3s,opacity .2s}
.otp input:focus{border-color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 10%,transparent)}
.otp input.filled{animation:tickIn .25s var(--spring)}
.otp.bad input{border-color:var(--warn)}
.otp.busy input{opacity:.45}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- Data ---------- */
const DEMO = [
  {id:'d1',name:'White linen shirt',category:'top',kind:'shirt',hex:'#f3f1ec',color:'white',style:'smart',occasions:['work','weekend','travel']},
  {id:'d2',name:'Black turtleneck',category:'top',kind:'knit',hex:'#1b1b1d',color:'black',style:'smart',occasions:['work','dinner','date']},
  {id:'d3',name:'Breton striped tee',category:'top',kind:'tee',hex:'#f6f3ea',pattern:'stripe',color:'cream with navy stripes',style:'casual',occasions:['weekend','travel']},
  {id:'d4',name:'Camel blazer',category:'outerwear',kind:'blazer',hex:'#b88a5c',color:'camel',style:'smart',occasions:['work','dinner']},
  {id:'d5',name:'Beige trench coat',category:'outerwear',kind:'coat',hex:'#cdb894',color:'beige',style:'smart',occasions:['work','weekend','travel']},
  {id:'d6',name:'Straight blue jeans',category:'bottom',kind:'jeans',hex:'#5d7fa3',color:'mid blue',style:'casual',occasions:['weekend','dinner','travel']},
  {id:'d7',name:'Black tailored trousers',category:'bottom',kind:'trousers',hex:'#232325',color:'black',style:'smart',occasions:['work','dinner']},
  {id:'d8',name:'Cream midi skirt',category:'bottom',kind:'skirt',hex:'#e8dcc8',color:'cream',style:'smart',occasions:['work','dinner','date']},
  {id:'d9',name:'Olive slip dress',category:'dress',kind:'dress',hex:'#6c6f48',color:'olive',style:'evening',occasions:['dinner','date']},
  {id:'d10',name:'White leather sneakers',category:'shoes',kind:'sneaker',hex:'#f7f7f5',color:'white',style:'casual',occasions:['weekend','travel','work']},
  {id:'d11',name:'Black loafers',category:'shoes',kind:'loafer',hex:'#1d1d1f',color:'black',style:'smart',occasions:['work','dinner','date']},
  {id:'d12',name:'Tan shoulder bag',category:'accessory',kind:'bag',hex:'#a9774b',color:'tan',style:'smart',occasions:['work','dinner','date','weekend']}
];
const SAMPLE_IDS = new Set(DEMO.map(x=>x.id));
const ownItems = () => state.items.filter(i=>!SAMPLE_IDS.has(i.id));
// Starter wardrobe: five everyday pieces a new user adds one at a time.
const STARTER = [
  {cat:'top',       also:[],        t:'A top you wear a lot',    d:'A tee, shirt or knit you reach for every week.'},
  {cat:'bottom',    also:['dress'], t:'Something for your legs', d:'Jeans, trousers or a skirt. A dress counts too.'},
  {cat:'shoes',     also:[],        t:'Your go-to shoes',        d:'The pair you wear most days.'},
  {cat:'outerwear', also:[],        t:'A layer',                 d:'A jacket, blazer, cardigan or coat.'},
  {cat:'accessory', also:[],        t:'A bag or accessory',      d:'It finishes the look.'},
];
const lower1 = s => s[0].toLowerCase() + s.slice(1);
function starterState(){
  const own = ownItems(), has = c => own.some(i=>i.category===c);
  const done = STARTER.map(s=>has(s.cat) || s.also.some(has));
  return {done, n:done.filter(Boolean).length, next:done.indexOf(false), ready:has('shoes') && (has('dress') || (has('top') && has('bottom')))};
}
const guideOn = () => !!state.profile && !state.profile.guest && state.profile.guide === 'on';
// Favorite shops (up to 3, picked in onboarding). A shop with its own search page links straight to it;
// the rest search the shop's site on the web, which works in every country and for shops people add themselves.
const SHOPS = [['Zara','zara.com'],['H&M','hm.com'],['COS','cos.com'],['Mango','mango.com'],['Uniqlo','uniqlo.com'],['Massimo Dutti','massimodutti.com'],
  ['& Other Stories','stories.com'],['Arket','arket.com'],['ASOS','asos.com'],['Reformation','thereformation.com'],['Aritzia','aritzia.com'],['Everlane','everlane.com']];
const SHOP_SITE = Object.fromEntries(SHOPS);
const SHOP_SEARCH = {'H&M':'https://www2.hm.com/el_gr/search-results.html?q='};   // H&M Greece (Greek; there's no English Greece site)
const shopLink = (shop, q) => SHOP_SEARCH[shop] ? SHOP_SEARCH[shop] + encodeURIComponent(q)
  : 'https://www.google.com/search?q=' + encodeURIComponent(SHOP_SITE[shop] ? `${q} site:${SHOP_SITE[shop]}` : `${shop} ${q}`);
const anyShopLink = q => 'https://www.google.com/search?tbm=shop&q=' + encodeURIComponent(q);
// Versatile pieces the app can suggest when they'd make the most new outfits with what someone owns.
const BASICS = [
  {name:'White tee', category:'top', kind:'tee', color:'white', hex:'#f4f4f2'},
  {name:'Striped tee', category:'top', kind:'tee', color:'cream', hex:'#f6f3ea', pattern:'stripe', print:true},
  {name:'White shirt', category:'top', kind:'shirt', color:'white', hex:'#f3f1ec'},
  {name:'Black turtleneck', category:'top', kind:'knit', color:'black', hex:'#1b1b1d'},
  {name:'Grey knit', category:'top', kind:'knit', color:'grey', hex:'#9a9a9e'},
  {name:'Straight jeans', category:'bottom', kind:'jeans', color:'denim', hex:'#5d7fa3'},
  {name:'Black trousers', category:'bottom', kind:'trousers', color:'black', hex:'#232325'},
  {name:'Beige trousers', category:'bottom', kind:'trousers', color:'beige', hex:'#d6c3a3'},
  {name:'Midi skirt', category:'bottom', kind:'skirt', color:'cream', hex:'#e8dcc8'},
  {name:'Black slip dress', category:'dress', kind:'dress', color:'black', hex:'#1d1d1f'},
  {name:'Navy blazer', category:'outerwear', kind:'blazer', color:'navy', hex:'#22304f'},
  {name:'Camel blazer', category:'outerwear', kind:'blazer', color:'camel', hex:'#b88a5c'},
  {name:'Trench coat', category:'outerwear', kind:'coat', color:'beige', hex:'#cdb894'},
  {name:'White sneakers', category:'shoes', kind:'sneaker', color:'white', hex:'#f7f7f5'},
  {name:'Black loafers', category:'shoes', kind:'loafer', color:'black', hex:'#1d1d1f'},
  {name:'Tan shoulder bag', category:'accessory', kind:'bag', color:'tan', hex:'#a9774b'},
  {name:'Black tote bag', category:'accessory', kind:'bag', color:'black', hex:'#1b1b1b'},
];
// How many complete outfits (top + bottom, or a dress, plus shoes) a wardrobe makes; layers and bags add variations.
function outfitCount(n){ const base = (n.top*n.bottom + n.dress) * n.shoes; return base + base*n.outerwear*.6 + base*Math.min(n.accessory, 2)*.3; }
function ideas(){
  const items = state.items, p = state.profile || {}, n = {};
  ['top','bottom','dress','outerwear','shoes','accessory'].forEach(c=>n[c] = items.filter(i=>i.category===c).length);
  const now = outfitCount(n), loved = (p.colors||[]).map(c=>c.toLowerCase()), avoid = p.avoid || [];
  const owned = b => items.some(i=>i.category===b.category && String(i.color||'').toLowerCase().includes(b.color));
  const scored = BASICS.filter(b=>!owned(b) && !(b.print && avoid.includes('Bold prints'))).map(b=>{
    const gain = outfitCount({...n, [b.category]:n[b.category]+1}) - now;
    return {...b, gain:Math.round(gain), score:gain * (loved.some(c=>b.color.includes(c) || c.includes(b.color)) ? 1.3 : 1) + (n[b.category] ? 0 : .5)};
  }).filter(b=>b.gain > 0 || !n[b.category]).sort((a,b)=>b.score - a.score);
  const picks = [];
  for (const b of scored){ if (!picks.some(x=>x.category===b.category)) picks.push(b); if (picks.length === 3) break; }
  return picks.map(b=>{
    const goes = items.filter(i=>({top:['bottom','shoes'], bottom:['top','shoes'], dress:['shoes','outerwear'], outerwear:['top','bottom','dress'], shoes:['top','bottom','dress'], accessory:['top','dress']})[b.category].includes(i.category));
    return {...b, goes:goes.slice(0, 3).map(i=>i.name)};
  });
}
const PHOTO_TIPS = ['Plain background','One piece per photo','Good daylight','Lay it flat or hang it up'].map(t=>`<span class="tag">${t}</span>`).join('');
const CATS = {top:'Tops',bottom:'Bottoms',dress:'Dresses',outerwear:'Layers',shoes:'Shoes',accessory:'Bags & more'};
const CAT_ONE = {top:'Top',bottom:'Bottom',dress:'Dress',outerwear:'Layer',shoes:'Shoes',accessory:'Accessory'};
const KIND_FOR = {top:'tee',bottom:'trousers',dress:'dress',outerwear:'blazer',shoes:'sneaker',accessory:'bag'};
const OCCASIONS = [['work','Work'],['dinner','Dinner'],['weekend','Weekend'],['date','Date night'],['travel','Travel']];
const STYLES = ['casual','smart','formal','sporty','evening'];
const KEY = 'stylist.v1';

let state = {items:DEMO.map(x=>({...x})), saved:[], view:'wardrobe', filter:'all', mode:'occasion', occasion:'work', note:'', results:null, loading:false, find:null, findCat:'top', error:''};
state.profile = null;
try{ const s = JSON.parse(localStorage.getItem(KEY)||'null'); if(s){ state.items = s.items||state.items; state.saved = s.saved||[]; state.profile = s.profile||null; } }catch(e){}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify({items:state.items,saved:state.saved,profile:state.profile})); }catch(e){ toast('Storage is full. Remove a few photos.'); } }

/* ---------- Accounts (Supabase) ---------- */
// The publishable key is meant to be public; never put the secret key in this page.
const SB_URL = 'https://rofoseeoftutmmkuuzfk.supabase.co';
const SB_KEY = 'sb_publishable_R0QGGx2xRxwneDmEdwZoOw_MWRe_v7F';
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
let googleOn = false;
fetch(SB_URL + '/auth/v1/settings', {headers:{apikey:SB_KEY}}).then(r=>r.json()).then(s=>{ googleOn = !!s.external?.google; }).catch(()=>{});
// Test mode: off unless switched on, and only on this computer (localhost). Codes show on screen,
// no email is sent and no real account is made.
const IS_LOCAL = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
let testAuth = false; try{ testAuth = IS_LOCAL && localStorage.getItem('stylist.authMode') === 'test'; }catch(e){}
function setTestAuth(on){ testAuth = IS_LOCAL && on; try{ localStorage.setItem('stylist.authMode', on ? 'test' : 'real'); }catch(e){} }
function modeLine(){
  if (!IS_LOCAL) return '';
  return testAuth ? `<p class="fine">Test mode: codes show on screen and no email is sent. <button class="link" type="button" data-ob="realmode">Use real email</button></p>`
    : `<p class="fine">Real emails are on. <button class="link" type="button" data-ob="testmode">Switch to test mode</button></p>`;
}
const firstName = m => (m.first_name || String(m.full_name || m.name || '').split(' ')[0] || '').slice(0,30);
const lastName = m => (m.last_name || String(m.full_name || m.name || '').split(' ').slice(1).join(' ') || '').slice(0,40);
function profileFromUser(u){
  const m = u.user_metadata || {};
  return {provider: u.app_metadata?.provider==='google' ? 'google' : 'email', name:firstName(m), last:lastName(m), email:u.email||'', vibes:m.vibes||[], shops:m.shops||[], occasions:m.occasions||[], colors:m.colors||[], avoid:m.avoid||[], onboarded:!!m.onboarded, guide:m.guide==='on' ? 'on' : 'off', guest:false};
}
function authErr(e, fallback){
  const c = e?.code || '', s = e?.status;
  if (c==='otp_disabled' || /signups not allowed/i.test(e?.message||'')) return 'nouser';
  if (c==='over_email_send_rate_limit') return 'Too many emails were sent just now. Wait a few minutes and try again.';
  if (s===429) return 'Too many tries. Wait a minute and try again.';
  if (s>=500) return 'Our email service isn’t responding right now. Try again in a few minutes.';
  if (c==='otp_expired' || /expired|invalid/i.test(e?.message||'')) return 'That code isn’t right or has expired. Check the email and try again.';
  return fallback;
}

/* ---------- Cloud wardrobe (supabase/wardrobe.sql) ---------- */
// While someone is signed in for real, their wardrobe and saved outfits live in Supabase
// (row-level security keeps each person to their own rows; photos sit in a private bucket).
// Guests and test mode keep everything in this browser as before.
let cloud = null;
const BUCKET = 'wardrobe';
const itemRow = (i, path, at) => ({id:i.id, name:String(i.name).slice(0,60), category:i.category, kind:i.kind||null, color:String(i.color||'').slice(0,60),
  hex:/^#[0-9a-f]{6}$/i.test(i.hex||'') ? i.hex : null, pattern:i.pattern||null, style:i.style||null, occasions:(i.occasions||[]).slice(0,10), photo_path:path||null, ...(at ? {created_at:at} : {})});
const outfitRow = (o, path, at) => ({id:o.id, title:String(o.title||'Outfit').slice(0,60), why:String(o.why||'').slice(0,1000), occasion:o.occasion||null,
  item_ids:(o.itemIds||[]).slice(0,12), find_name:o.find ? String(o.find.name||'').slice(0,80) : null, find_path:path||null, ...(at ? {created_at:at} : {})});
async function upPhoto(kind, id, dataUrl){
  if (!dataUrl || !dataUrl.startsWith('data:')) return null;
  const blob = await (await fetch(dataUrl)).blob(), ext = {'image/png':'png', 'image/webp':'webp'}[blob.type] || 'jpg';
  const path = `${cloud.id}/${kind}-${id}.${ext}`;
  const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType:blob.type || 'image/jpeg', upsert:true});
  if (error) throw error;
  return path;
}
function cloudDo(job){
  if (!cloud) return;
  job().catch(()=>toast('Couldn’t save that to your account. Check your connection.'));
}
async function cloudAddItems(items){
  const now = Date.now();   // newest first in the app, so give earlier list entries later timestamps
  const rows = await Promise.all(items.map(async (i, k)=>{ const p = await upPhoto('item', i.id, i.img); if (p) i.photo = p; return itemRow(i, p, new Date(now - k).toISOString()); }));
  if (!rows.length) return;
  const {error} = await sb.from('wardrobe_items').insert(rows); if (error) throw error;

async function cloudAddOutfits(list){

  const name = NAMED_LAB.reduce((best, [n, l])=>{ const d = (l[0]-lab[0])**2 + (l[1]-lab[1])**2 + (l[2]-lab[2])**2; return d < best[1] ? [n, d] : best; }, ['', Infinity])[0];
  return {hex:'#' + main.map(v=>v.toString(16).padStart(2, '0')).join(''), name};
}

function clean(outfits, needFind){
  const seen = new Set(); const out = [];
  for (const o of (Array.isArray(outfits)?outfits:[])){
    const ids = [...new Set((o.itemIds||[]).map(String))].filter(id=>byId(id));
    if (!ids.length && !needFind) continue;
    const k = ids.slice().sort().join('+'); if (seen.has(k)) continue; seen.add(k);
    out.push({title:String(o.title||'Outfit').slice(0,40), why:String(o.why||''), itemIds:ids});
    if (out.length===3) break;
  }
  return out;
}
let capTimer;
async function runStyle(){
  const findMode = state.mode==='find';
  if (!findMode && !canOutfit()){
    state.results = null; state.error = 'To make an outfit, add at least a top and a bottom (or a dress), plus shoes. Your wardrobe page shows what to add next.';
    return render();
  }
  const prev = state.results ? state.results.outfits.map(o=>o.itemIds.map(id=>byId(id)?.name).join(' + ')) : [];
  state.loading = true; state.error=''; render();
  const caps = ['Reading your wardrobe','Pairing colors','Checking proportions','Adding finishing touches'];
  let ci = 0; clearInterval(capTimer);
  capTimer = setInterval(()=>{ const c=$('#cap'); if(!c) return; c.style.opacity=0; setTimeout(()=>{ ci=(ci+1)%caps.length; c.textContent=caps[ci]; c.style.opacity=1; },250); }, 1700);
  let res = null;
  const occName = (OCCASIONS.find(x=>x[0]===state.occasion)||[])[1];
  try{
    if (!aiOn() || (findMode && !canImages)) throw {code:'local'};
    const rules = profileText() + `Rules: use ONLY ids from the wardrobe list. Each outfit must be complete: a top plus a bottom, or a dress, plus shoes. Add a layer or bag only when it helps. Make each outfit clearly different.${prev.length?' Avoid repeating these combinations: '+prev.join('; ')+'.':''}`;
    if (!findMode){
      const p = `You are a friendly personal stylist. Build exactly 3 outfits for: ${occName}.${state.note?' The person adds: "'+state.note+'".':''}
Wardrobe (id | name | category | color | style | occasions):
${wardrobeText()}
${rules}
Reply with only JSON: {"outfits":[{"title":"2-4 word name","itemIds":["d1","d7"],"why":"One or two plain sentences on why it works for this occasion: color, shape, mood."}],"missing":"If the wardrobe cannot make 3 complete outfits, one short sentence on which piece to add; otherwise empty string"}`;
      const r = await sample.json(p, {modelTier:'quick', cache:false});
      res = {outfits:clean(r&&r.outfits).map(o=>({...o, occasion:state.occasion})), missing:(r&&r.missing)||''};
    } else {
      const p = `You are a friendly personal stylist. The image is a clothing item the person found online and is thinking of buying. Style it with their own wardrobe for: ${occName}.
Wardrobe (id | name | category | color | style | occasions):
${wardrobeText()}
Build exactly 3 outfits. The new find is ALWAYS part of every outfit automatically, so do not list it in itemIds. ${rules} Count the find toward completeness.
Reply with only JSON: {"find":{"name":"short name like Red knit cardigan","category":"top|bottom|dress|outerwear|shoes|accessory"},"outfits":[{"title":"2-4 word name","itemIds":["d6","d10"],"why":"One or two plain sentences on why the find works with these pieces."}],"missing":"empty string, or one short sentence if the wardrobe lacks a piece to make it work"}`;
      const file = state.find.file || await (await fetch(state.find.img)).blob();
      const r = await sample.json(p, {modelTier:'quick', cache:false, images:[file]});
      if (r && r.find && r.find.name) state.find.name = String(r.find.name).slice(0,40);
      const f = {img:state.find.img, name:state.find.name};
      res = {outfits:clean(r&&r.outfits,true).map(o=>({...o, occasion:state.occasion, find:f})), missing:(r&&r.missing)||''};
    }
    if (!res.outfits.length) throw {code:'empty'};
  }catch(e){
    if (e && e.code!=='local' && e.code!=='empty') state.error = aiFail(e);
    if (e && e.code==='empty') state.error = 'AI couldn’t build complete outfits from these pieces, so here are simple matches.';
    res = localStyle(findMode);
  }
  clearInterval(capTimer);
  state.loading = false; state.results = res; render();
}

/* Simple matching when AI is not available */
function localStyle(findMode){
  const occ = state.occasion, pick = a => a[Math.floor(Math.random()*a.length)];
  const fits = i => (i.occasions||[]).includes(occ);
  const loved = (state.profile?.colors||[]).map(c=>c.toLowerCase());
  const pool = c => { const all = state.items.filter(i=>i.category===c); const good = all.filter(fits); const base = good.length?good:all; const fav = base.filter(i=>loved.some(l=>(i.color||'').toLowerCase().includes(l))); return fav.length && Math.random()<.6 ? fav : base; };
  const fc = findMode ? state.findCat : null;
  const outs = []; const seen = new Set();
  for (let t=0; t<40 && outs.length<3; t++){
    const ids = [];
    const useDress = fc==='dress' || (!fc || fc==='outerwear' || fc==='shoes' || fc==='accessory') && pool('dress').length && Math.random()<.3 && !['top','bottom'].includes(fc);
    if (useDress && fc!=='dress'){ const d=pool('dress'); if(d.length) ids.push(pick(d).id); }
    else if (!useDress){
      if (fc!=='top'){ const a=pool('top'); if(a.length) ids.push(pick(a).id); }
      if (fc!=='bottom'){ const a=pool('bottom'); if(a.length) ids.push(pick(a).id); }
    }
    if (fc!=='shoes'){ const a=pool('shoes'); if(a.length) ids.push(pick(a).id); }
    if (fc!=='outerwear' && ['work','dinner','travel'].includes(occ) && Math.random()<.6){ const a=pool('outerwear'); if(a.length) ids.push(pick(a).id); }
    if (fc!=='accessory' && Math.random()<.5){ const a=pool('accessory'); if(a.length) ids.push(pick(a).id); }
    const k = ids.slice().sort().join('+'); if (!ids.length || seen.has(k)) continue; seen.add(k);
    const items = ids.map(byId);
    const colors = [...new Set(items.map(i=>i.color))].slice(0,3).join(', ');
    outs.push({title:['Easy classic','Clean lines','Quiet contrast','Soft and simple','Off-duty'][outs.length+Math.floor(Math.random()*2)],
      why:`${colors} sit well together, and every piece here is one you already tagged for ${(OCCASIONS.find(x=>x[0]===occ)||[])[1].toLowerCase()}.${state.profile?.vibes?.length?' It suits your '+vibeName(state.profile.vibes[0]).toLowerCase()+' style.':''}`,
      itemIds:ids, occasion:occ, find: findMode?{img:state.find.img,name:state.find.name||'Your find'}:null});
  }
  return {outfits:outs, missing: outs.length?'':'Add a few more pieces to get complete outfits.'};
}

  const d0 = draft, cut = await cutout(d0.img).catch(()=>null);
  if (draft !== d0) return;
  const white = cut && await onWhite(cut).catch(()=>null);
  if (draft !== d0) return;
  if (white){ Object.assign(draft, {original:draft.img, cutImg:white, img:white, cut:true}); paintAdd(); } else draft.cutFailed = true;
  // Default color from the garment itself; the AI's answer (when it's available) replaces it below.
  const mc = await mainColor(cut || d0.img, !!cut).catch(()=>null);
  if (draft !== d0) return;
  if (mc) Object.assign(draft, {hex:mc.hex, color:mc.name});
  if (aiOn() && canImages){
    try{
      const r = await sample.json(`The image shows one clothing item (a photo or a shop screenshot). Describe it for a wardrobe app. Reply with only JSON:
{"name":"short friendly name, e.g. White linen shirt","category":"top|bottom|dress|outerwear|shoes|accessory","color":"main color in 1-3 plain words","hex":"#rrggbb approximate main color","style":"casual|smart|formal|sporty|evening","occasions":["any of: work, dinner, weekend, date, travel"],"isClothing":true}`, {modelTier:'quick', images:[file]});
      if (!draft) return;
      Object.assign(draft, {
        name:String(r.name||'').slice(0,40), category: CAT_ONE[r.category]?r.category:draft.category, color:r.color ? String(r.color) : draft.color,
        hex:/^#[0-9a-f]{6}$/i.test(r.hex||'')?r.hex:draft.hex, style: STYLES.includes(r.style)?r.style:'casual',
        occasions:(Array.isArray(r.occasions)?r.occasions:[]).filter(o=>OCCASIONS.some(x=>x[0]===o)), ai:true,
        msg: r.isClothing===false ? 'This doesn’t look like clothing. You can still add it.' : ''
      });
    }catch(e){ if(!draft) return; draft.msg = aiFail(e)+' Fill in the details below.'; }
  } else draft.msg = draft.color ? 'Demo mode: we picked the color from your photo. Fill in the rest below.' : 'Demo mode: fill in the details below.';
  if (!draft) return;
  draft.step='edit'; paintAdd();
}
function saveItem(){

  if (state.profile && !state.profile.guest && !(state.profile.test && testAuth)){ state.profile = null; persist(); paintMe(); }
  if (!state.profile) startOnboarding('email');
})();
</script>
